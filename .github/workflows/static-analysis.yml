name: Static Analysis

on:
  push:
    branches: [main, develop, "milestone/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with clang-tidy
        run: cmake --build build 2>&1 | tee clang-tidy-output.log

      - name: Check for warnings
        run: |
          WARNINGS=$(grep -c "warning:" clang-tidy-output.log || echo 0)
          echo "clang-tidy warnings: $WARNINGS"
          echo "## clang-tidy" >> "$GITHUB_STEP_SUMMARY"
          echo "Warnings: **$WARNINGS**" >> "$GITHUB_STEP_SUMMARY"

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with ASAN
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBEEPING_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build

      - name: Run tests under ASAN
        run: cd build && ctest --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    continue-on-error: true  # BEE-1622: known signed integer overflow in encoder
    steps:
      - uses: actions/checkout@v4

      - name: Configure with UBSAN
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBEEPING_ENABLE_UBSAN=ON

      - name: Build
        run: cmake --build build

      - name: Run tests under UBSAN
        run: cd build && ctest --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
