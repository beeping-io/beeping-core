name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Run release-please
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived (1h TTL) installation token for the
      # `beeping-io-release-please` GitHub App so release-please pushes the
      # release tag with a non-GITHUB_TOKEN identity. Tags pushed by the
      # default GITHUB_TOKEN do NOT trigger downstream workflows (GitHub
      # protects against recursive workflow loops), which is why v0.7.0
      # required a manual `git push origin --delete v0.7.0 && git push`
      # workaround. With the app token, the tag push fires release.yml
      # automatically. (BEE-2224.)
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          # See docs/setup/releases.md for the full setup procedure +
          # troubleshooting guide if the app token rotation breaks.
          token: ${{ steps.app-token.outputs.token }}
          # The repo's default branch is `develop` (integration branch); without
          # an explicit target-branch, release-please picks up `develop` as the
          # release base — opening release PRs against the wrong branch and
          # bumping versions out of step with the actual tag history. Pin to
          # `main` since that is where releases live (release.yml fires on
          # tag pushes from main).
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
