name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write
  id-token: write  # for cosign keyless

env:
  CMAKE_BUILD_TYPE: Release
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # macOS — universal binary (arm64 + x86_64)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DBEEPING_BUILD_CLI=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Verify lib universal
        run: lipo -info install/lib/libBeepingCore.a

      - name: Verify CLI binary universal
        run: |
          test -x install/bin/beeping-core || { echo "❌ CLI binary missing at install/bin/beeping-core"; exit 1; }
          lipo -info install/bin/beeping-core

      - name: Smoke-test CLI
        run: |
          install/bin/beeping-core --help
          install/bin/beeping-core --version

      - name: Package
        run: |
          cd install
          tar --zstd -cf ../beeping-core-macos-universal.tar.zst .
          cd ..
          shasum -a 256 beeping-core-macos-universal.tar.zst > beeping-core-macos-universal.sha256

      - name: Verify CLI in tarball
        run: |
          mkdir verify
          tar --zstd -xf beeping-core-macos-universal.tar.zst -C verify
          test -x verify/bin/beeping-core || { echo "❌ CLI binary missing in packaged tarball"; exit 1; }
          verify/bin/beeping-core --help

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-macos-universal
          path: |
            beeping-core-macos-universal.tar.zst
            beeping-core-macos-universal.sha256

  # ---------------------------------------------------------------------------
  # Linux — amd64
  # ---------------------------------------------------------------------------
  linux-amd64:
    name: Linux amd64
    # ubuntu-22.04 = glibc 2.35 (baseline). Forward-compatible with Ubuntu
    # 22.04+, Debian 12+, Fedora 41+, Arch (all have glibc >= 2.35). If we
    # built on ubuntu-latest (24.04, glibc 2.39) the binary would fail to
    # load on older distros — discovered in BEE-1729 first smoke matrix run.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DBEEPING_BUILD_CLI=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Verify CLI binary
        run: |
          test -x install/bin/beeping-core || { echo "❌ CLI binary missing at install/bin/beeping-core"; exit 1; }
          file install/bin/beeping-core
          ldd install/bin/beeping-core || true

      - name: Smoke-test CLI
        run: |
          install/bin/beeping-core --help
          install/bin/beeping-core --version

      - name: Package
        run: |
          cd install
          tar --zstd -cf ../beeping-core-linux-amd64.tar.zst .
          cd ..
          sha256sum beeping-core-linux-amd64.tar.zst > beeping-core-linux-amd64.sha256

      - name: Verify CLI in tarball
        run: |
          mkdir verify
          tar --zstd -xf beeping-core-linux-amd64.tar.zst -C verify
          test -x verify/bin/beeping-core || { echo "❌ CLI binary missing in packaged tarball"; exit 1; }
          verify/bin/beeping-core --help

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-linux-amd64
          path: |
            beeping-core-linux-amd64.tar.zst
            beeping-core-linux-amd64.sha256

  # ---------------------------------------------------------------------------
  # Linux compat smoke matrix — verify the linux-amd64 binary actually runs
  # on multiple glibc distros before allowing the release to publish.
  # Alpine (musl) is intentionally excluded: BEE-1729 ships glibc-only.
  # If demand for musl arises, a separate `beeping-core-linux-amd64-musl.tar.zst`
  # variant will be added in its own task.
  # ---------------------------------------------------------------------------
  linux-compat-smoke:
    name: Linux compat (${{ matrix.image }})
    needs: [linux-amd64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:41
          - archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beeping-core-linux-amd64
          path: artifact

      - name: Smoke test binary in ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/artifact:/release:ro" \
            ${{ matrix.image }} \
            sh -c "
              set -e
              # Install zstd if not present (Debian / Ubuntu may need it; Fedora/Arch usually have it)
              command -v zstd >/dev/null 2>&1 || \
                (command -v apt-get >/dev/null 2>&1 && apt-get update -qq && apt-get install -y -qq zstd) || \
                (command -v dnf >/dev/null 2>&1 && dnf install -y -q zstd) || \
                (command -v pacman >/dev/null 2>&1 && pacman -Sy --noconfirm zstd)
              tar --zstd -xf /release/beeping-core-linux-amd64.tar.zst -C /opt
              /opt/bin/beeping-core --help
              /opt/bin/beeping-core --version
              echo '✅ ${{ matrix.image }} OK'
            "

  # ---------------------------------------------------------------------------
  # Linux — arm64 (cross-compile)
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux arm64
    # BEE-1696 — re-enable when Linux ARM64 / Raspberry Pi validated E2E
    if: false
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          cd install
          tar --zstd -cf ../beeping-core-linux-arm64.tar.zst .
          cd ..
          sha256sum beeping-core-linux-arm64.tar.zst > beeping-core-linux-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-linux-arm64
          path: |
            beeping-core-linux-arm64.tar.zst
            beeping-core-linux-arm64.sha256

  # ---------------------------------------------------------------------------
  # Android NDK — arm64-v8a, armeabi-v7a, x86_64
  # ---------------------------------------------------------------------------
  android:
    name: Android NDK (${{ matrix.abi }})
    # Phase 8 — re-enable when beeping-android SDK task validates end-to-end
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          cd install
          tar --zstd -cf ../beeping-core-android-${{ matrix.abi }}.tar.zst .
          cd ..
          sha256sum beeping-core-android-${{ matrix.abi }}.tar.zst > beeping-core-android-${{ matrix.abi }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-android-${{ matrix.abi }}
          path: |
            beeping-core-android-${{ matrix.abi }}.tar.zst
            beeping-core-android-${{ matrix.abi }}.sha256

  # ---------------------------------------------------------------------------
  # iOS — XCFramework (device + simulator)
  # ---------------------------------------------------------------------------
  ios:
    name: iOS XCFramework
    # Phase 9 — re-enable when beeping-ios SDK task validates end-to-end
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS device (arm64)
        run: |
          cmake -B build-ios-device \
            -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_INSTALL_PREFIX=install-device
          cmake --build build-ios-device --config Release -j
          cmake --install build-ios-device --config Release

      - name: Build iOS simulator (arm64)
        run: |
          cmake -B build-ios-sim \
            -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_INSTALL_PREFIX=install-sim
          cmake --build build-ios-sim --config Release -j
          cmake --install build-ios-sim --config Release

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library install-device/lib/libBeepingCore.a -headers install-device/include \
            -library install-sim/lib/libBeepingCore.a -headers install-sim/include \
            -output BeepingCore.xcframework

      - name: Package
        run: |
          tar --zstd -cf beeping-core-ios-xcframework.tar.zst BeepingCore.xcframework
          shasum -a 256 beeping-core-ios-xcframework.tar.zst > beeping-core-ios-xcframework.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-ios-xcframework
          path: |
            beeping-core-ios-xcframework.tar.zst
            beeping-core-ios-xcframework.sha256

  # ---------------------------------------------------------------------------
  # WASM — Emscripten
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM (Emscripten)
    # BEE-1731 — re-enable when WASM browser E2E QA validated
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: 'emsdk-cache'

      - name: Configure
        run: |
          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          cd install
          tar --zstd -cf ../beeping-core-wasm.tar.zst .
          cd ..
          sha256sum beeping-core-wasm.tar.zst > beeping-core-wasm.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: beeping-core-wasm
          path: |
            beeping-core-wasm.tar.zst
            beeping-core-wasm.sha256

  # ---------------------------------------------------------------------------
  # SBOM — CycloneDX inventory of all dependencies
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: beeping-core-sbom.cdx.json

      - name: Compute SBOM checksum
        run: sha256sum beeping-core-sbom.cdx.json > beeping-core-sbom.cdx.json.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            beeping-core-sbom.cdx.json
            beeping-core-sbom.cdx.json.sha256

  # ---------------------------------------------------------------------------
  # Hashes — compute sha256 of every artifact for SLSA provenance
  # ---------------------------------------------------------------------------
  hashes:
    name: Compute artifact hashes
    needs: [macos, linux-amd64, linux-compat-smoke, sbom]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.compute.outputs.hashes }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute base64-encoded hashes
        id: compute
        run: |
          cd artifacts
          HASHES=$(sha256sum *.tar.zst beeping-core-sbom.cdx.json | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # SLSA L3 provenance — reusable workflow (requires public repo + OIDC)
  # ---------------------------------------------------------------------------
  provenance:
    name: SLSA L3 provenance
    needs: [hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.hashes.outputs.hashes }}"
      upload-assets: true
      provenance-name: beeping-core.intoto.jsonl

  # ---------------------------------------------------------------------------
  # Consolidate + sign + publish release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [macos, linux-amd64, linux-compat-smoke, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256
          ls -la

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries (cosign keyless)
        run: |
          cd artifacts
          for f in *.tar.zst; do
            cosign sign-blob --yes --output-signature "$f.sig" "$f"
          done

      - name: Sign SBOM (cosign keyless)
        run: |
          cd artifacts
          cosign sign-blob --yes \
            --output-signature beeping-core-sbom.cdx.json.sig \
            beeping-core-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: beeping-core ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.zst
            artifacts/*.sig
            artifacts/beeping-core-sbom.cdx.json
            artifacts/SHA256SUMS.txt
